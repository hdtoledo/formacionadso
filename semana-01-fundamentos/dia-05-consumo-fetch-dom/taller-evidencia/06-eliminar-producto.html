<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo 06: Eliminar Insumo | AgroHuila S.A.S.</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full flex flex-col font-sans text-slate-800 bg-slate-50 p-4 sm:p-8">

  <div class="max-w-xl mx-auto w-full space-y-6">
    <!-- Navegación -->
    <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-emerald-800 hover:text-emerald-950 transition">
      &larr; Volver al Hub de AgroHuila
    </a>

    <!-- Encabezado de la Actividad -->
    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-xs font-mono font-bold px-2.5 py-1 rounded-md bg-rose-100 text-rose-800">MÓDULO 06</span>
        <span class="text-xs font-mono font-bold text-slate-400">DELETE /api/insumos/:id</span>
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Dar de Baja Insumo del Inventario</h1>
      <p class="text-xs text-slate-600 leading-relaxed">
        Aplica el verbo destructivo <code class="font-mono text-rose-700 font-bold">DELETE</code> para retirar un producto de la base de datos de AgroHuila. Asegura la acción solicitando confirmación previa mediante <code class="font-mono font-bold">confirm()</code>.
      </p>
    </div>

    <!-- Panel de Eliminación -->
    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
      <div>
        <label for="input-id" class="block text-xs font-bold text-slate-700 mb-1">ID del Insumo a Eliminar:</label>
        <input type="number" id="input-id" min="1" placeholder="Ej: 6" required
               class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-rose-500 outline-none">
      </div>

      <button id="btn-eliminar" class="w-full bg-rose-600 hover:bg-rose-700 active:scale-[0.99] text-white font-extrabold py-3 px-4 rounded-xl text-xs shadow transition">
        Dar de Baja Insumo con DELETE
      </button>

      <!-- Feedback de Respuesta -->
      <div id="mensaje-eliminar" class="hidden p-4 rounded-xl text-xs space-y-1"></div>
    </div>
  </div>

  <script>
    // ========================================================================
    // RETO 06: ELIMINACIÓN CON DELETE Y CONFIRMACIÓN PREVIA
    // ========================================================================
    const inputId = document.getElementById('input-id');
    const btnEliminar = document.getElementById('btn-eliminar');
    const mensajeEliminar = document.getElementById('mensaje-eliminar');

    btnEliminar.addEventListener('click', async () => {
      const id = inputId.value.trim();

      if (!id) {
        alert('Por favor ingresa un ID numérico.');
        return;
      }

      // PASO 1: Diálogo de confirmación para evitar borrados accidentales
      const confirmado = confirm(`¿Estás completamente seguro de dar de baja el insumo #${id} de AgroHuila?`);
      if (!confirmado) return;

      mensajeEliminar.className = 'block p-3 rounded-xl bg-blue-50 text-blue-900 border border-blue-200 text-xs font-mono';
      mensajeEliminar.textContent = `⏳ Despachando petición DELETE /api/insumos/${id}...`;

      try {

        // const res = await fetch(`http://localhost:3000/api/insumos/${id}`, {
        //   method: 'DELETE'
        // });

        // PASO 3: Manejo de 404 (Insumo no encontrado)

        //   mensajeEliminar.className = 'block p-4 rounded-xl bg-amber-50 border border-amber-300 text-amber-900 text-xs';
        //   mensajeEliminar.innerHTML = `⚠️ ${datos.error}`;
        //   return;
        // }

        // PASO 4: Manejo de 200 OK (Eliminación exitosa)
        // if (res.ok) {
        //   mensajeEliminar.className = 'block p-4 rounded-xl bg-rose-50 border border-rose-300 text-rose-900 text-xs font-bold';
        //   mensajeEliminar.innerHTML = `🗑️ ${datos.mensaje}`;
        //   inputId.value = '';
        //   return;
        // }

        // TODO: Completa el código retirando los comentarios anteriores.

      } catch (error) {
        mensajeEliminar.className = 'block p-3 rounded-xl bg-rose-50 border border-rose-300 text-rose-900 text-xs';
        mensajeEliminar.innerHTML = `❌ Error de red al comunicarse con el servidor.`;
      }
    });
  </script>
</body>
</html>
