<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller: Iniciar Sesión | Tailwind CSS & UI/UX</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sena: {
              green: '#39A900',
              'green-dark': '#2D8200',
              navy: '#00324D',
              'navy-dark': '#00263A',
              'navy-light': '#004A73'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<!-- PASO 1: Contenedor Principal Centrado con Flexbox y Fondo Sutil -->
<body class="min-h-full flex flex-col justify-center items-center font-sans antialiased text-slate-800 bg-gradient-to-br from-slate-100 via-emerald-50/30 to-slate-100 p-4 sm:p-6">

  <!-- Enlace superior -->
  <div class="w-full max-w-md mb-4 flex items-center justify-between text-xs">
    <a href="landing.html" class="inline-flex items-center gap-1.5 font-bold text-slate-500 hover:text-sena-green transition">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      <span>Volver a la Landing Page</span>
    </a>
    <span class="font-mono text-[11px] text-slate-400 bg-white px-2 py-0.5 rounded-md border border-slate-200">Práctica 01</span>
  </div>

  <!-- PASO 2: Tarjeta Blanca Principal con Bordes Redondeados y Sombra -->
  <main class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-xl space-y-6">
    
    <!-- Encabezado con Icono y Jerarquía Visual -->
    <div class="text-center space-y-2">
      <!-- TODO 1: Crea un contenedor para el icono con w-14 h-14, rounded-2xl y color sena-navy -->
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-sena-navy text-white shadow-md mb-1">
        <i data-lucide="shield-check" class="w-7 h-7 text-emerald-400"></i>
      </div>
      
      <!-- TODO 2: Título H1 con text-2xl font-extrabold text-slate-900 -->
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Bienvenido de nuevo</h1>
      
      <!-- TODO 3: Párrafo sutil con text-xs text-slate-500 -->
      <p class="text-xs sm:text-sm text-slate-500 max-w-xs mx-auto">
        Ingresa tus credenciales para acceder a la plataforma formativa de ADSO.
      </p>
    </div>

    <!-- Formulario -->
    <form id="login-form" class="space-y-4" onsubmit="event.preventDefault(); simularIngreso();">
      
      <!-- Campo Email -->
      <div class="space-y-1.5">
        <label for="email" class="block text-xs font-bold text-slate-700">Correo Electrónico Institucional</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="mail" class="w-4 h-4"></i>
          </div>
          <!-- TODO 4: Aplica clases a este input: pl-10 pr-4 py-2.5 bg-slate-50 border rounded-xl text-xs outline-none focus:ring-4 focus:ring-emerald-500/15 -->
          <input type="email" id="email" required placeholder="aprendiz@soy.sena.edu.co" 
                 class="w-full pl-10 pr-4 py-2.5 bg-slate-50 hover:bg-white focus:bg-white border border-slate-200 focus:border-sena-green rounded-xl text-xs sm:text-sm text-slate-800 placeholder-slate-400 outline-none focus:ring-4 focus:ring-emerald-500/15 transition-all">
        </div>
      </div>

      <!-- Campo Password -->
      <div class="space-y-1.5">
        <div class="flex items-center justify-between">
          <label for="password" class="block text-xs font-bold text-slate-700">Contraseña</label>
          <a href="#" class="text-xs font-semibold text-sena-green hover:underline">¿Olvidaste tu clave?</a>
        </div>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </div>
          <input type="password" id="password" required placeholder="••••••••••••" 
                 class="w-full pl-10 pr-10 py-2.5 bg-slate-50 hover:bg-white focus:bg-white border border-slate-200 focus:border-sena-green rounded-xl text-xs sm:text-sm text-slate-800 placeholder-slate-400 outline-none focus:ring-4 focus:ring-emerald-500/15 transition-all">
          <button type="button" onclick="alternarClave()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
            <i id="icono-ojo" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Checkbox Recordarme -->
      <div class="flex items-center justify-between pt-1">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-sena-green focus:ring-sena-green cursor-pointer">
          <span class="text-xs text-slate-600">Recordar sesión por 30 días</span>
        </label>
      </div>

      <!-- TODO 5: Botón Primario con Estilos Tailwind: w-full py-3 bg-sena-green hover:bg-sena-green-dark text-white font-extrabold rounded-xl shadow-md transition -->
      <button type="submit" id="btn-submit" 
              class="w-full py-3 px-4 bg-sena-green hover:bg-sena-green-dark active:scale-[0.99] text-white font-extrabold text-sm rounded-xl shadow-md shadow-emerald-600/20 hover:shadow-lg transition-all flex items-center justify-center gap-2 group cursor-pointer">
        <span id="btn-texto">Ingresar a la Plataforma</span>
        <i id="btn-icono" data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
      </button>

      <div id="feedback-msg" class="hidden p-3 rounded-xl text-xs font-medium text-center"></div>

    </form>

    <!-- Footer de la tarjeta -->
    <div class="pt-2 text-center text-xs text-slate-500 border-t border-slate-100">
      <span>¿No tienes cuenta?</span>
      <a href="register.html" class="font-extrabold text-sena-green hover:underline ml-1">Regístrate aquí &rarr;</a>
    </div>

  </main>

  <script>
    lucide.createIcons();

    function alternarClave() {
      const input = document.getElementById('password');
      const icono = document.getElementById('icono-ojo');
      if (input.type === 'password') {
        input.type = 'text';
        icono.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icono.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    function simularIngreso() {
      const btn = document.getElementById('btn-submit');
      const texto = document.getElementById('btn-texto');
      const icono = document.getElementById('btn-icono');
      const feedback = document.getElementById('feedback-msg');

      btn.disabled = true;
      btn.classList.add('opacity-80');
      texto.textContent = 'Autenticando...';
      icono.setAttribute('data-lucide', 'loader-2');
      icono.classList.add('animate-spin');
      lucide.createIcons();

      setTimeout(() => {
        btn.disabled = false;
        btn.classList.remove('opacity-80');
        texto.textContent = 'Ingresar a la Plataforma';
        icono.setAttribute('data-lucide', 'arrow-right');
        icono.classList.remove('animate-spin');
        lucide.createIcons();

        feedback.className = 'block p-3 rounded-xl bg-emerald-50 border border-emerald-300 text-emerald-800 text-xs font-bold text-center';
        feedback.textContent = '✓ ¡Acceso exitoso al sistema!';
      }, 1200);
    }
  </script>
</body>
</html>
